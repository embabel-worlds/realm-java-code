# The realm's answer surface over ANY jar. Every view takes `jar`, the path of the jar to read
# (relative to the world's data/ tree, absolute under a trusted root, or relative to this realm's
# directory); the jar is read when the view runs and nothing is stored. No view names a library.
# `jar`, and the type or field a drill-down is about, are required: a run without them is refused,
# naming the missing argument, rather than answered with nothing. Listing views return the
# exact names their drill-downs take.
#
# "Adds" and "removes" mean calls to the JDK's own container APIs (java.util collections and
# maps, ThreadLocal) made in the same method that touches the field. That is the approximation
# bytecode supports cheaply: it shows the method both touches the field and grows or shrinks a
# JDK container, not that the receiver is that field.

- name: JarSummary
  description: >-
    What a jar is: coordinate, file, SHA-256, type and package counts. The first call for any jar,
    and proof the path resolves. One row; not its contents — JarPackages and the type views list
    those.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:IS_ARTIFACT]->(a:JavaArtifact)
    OPTIONAL MATCH (j)-[:HAS_PACKAGE]->(p:JavaPackage)
    RETURN a.coordinate AS coordinate, a.fileName AS fileName, a.version AS version,
           a.sha256 AS sha256, a.types AS types, count(p) AS packages

- name: JarPackages
  description: >-
    The packages of a jar with how many types each holds, largest first.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_PACKAGE]->(p:JavaPackage)
    RETURN p.name AS package, p.types AS types
    ORDER BY types DESC, package
    LIMIT 500

- name: JavaTypeProfile
  description: >-
    One type's shape, by binary name: kind, supertypes, member counts, subtypes. The name is
    `pkg.Outer$Inner`, as a heap dump or stack trace prints it. Returns kind, visibility, source
    file, superclass and interfaces (inside or outside the jar), enclosing type, how many fields,
    static fields and methods it declares itself, and how many types in the jar directly extend or
    implement it. Direct subtypes only, and only those in the same jar; inherited members are not
    counted.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary class name, e.g. com.example.Cache$Entry." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_TYPE]->(t:JavaType {name: $type})
    OPTIONAL MATCH (t)-[:HAS_SUBCLASS]->(s:JavaType)
    OPTIONAL MATCH (t)-[:HAS_IMPLEMENTOR]->(i:JavaType)
    RETURN t.name AS type, t.kind AS kind, t.nesting AS nesting, t.visibility AS visibility,
           t.isAbstract AS isAbstract, t.isFinal AS isFinal, t.sourceFile AS sourceFile,
           t.superclass AS superclass, t.interfaces AS interfaces, t.enclosingType AS enclosingType,
           t.fields AS fields, t.staticFields AS staticFields, t.methods AS methods,
           t.typeParameters AS typeParameters, t.hashCodeFrom AS hashCodeFrom, t.equalsFrom AS equalsFrom,
           count(DISTINCT s) + count(DISTINCT i) AS directSubtypes

- name: JavaSubtypes
  description: >-
    Types in a jar that directly extend or implement a type, by binary name. The supertype may be
    outside the jar (`java.lang.Runnable`, `java.util.AbstractMap`): it is matched by name, so this
    answers "what in this jar implements X" for any X. Direct subtypes only, not their descendants,
    and only types inside the jar; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary name of the supertype or interface." }
    limit: { type: int, default: 200, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_TYPE]->(t:JavaType)
    WHERE t.superclass = $type OR $type IN t.interfaces
    RETURN t.name AS type, t.kind AS kind, t.nesting AS nesting, t.visibility AS visibility,
           CASE WHEN t.superclass = $type THEN 'extends' ELSE 'implements' END AS relation
    ORDER BY type
    LIMIT $limit

- name: JavaTypeFields
  description: >-
    The fields one type declares, with how many methods read and write each. Declared type,
    container kind, static, final and visibility per field: the step from a type to the field that
    holds memory. Inherited fields are not included; reader and writer counts are within the jar
    only.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary class name of the declaring type." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_TYPE]->(t:JavaType {name: $type})-[:DECLARES_FIELD]->(f:JavaField)
    OPTIONAL MATCH (f)-[:ACCESSED_BY]->(a:JavaFieldAccess)
    WITH f, sum(CASE WHEN a.access = 'READ' THEN 1 ELSE 0 END) AS readers,
            sum(CASE WHEN a.access = 'WRITE' THEN 1 ELSE 0 END) AS writers
    RETURN f.key AS field, f.name AS name, f.genericType AS declaredType, f.container AS container,
           f.isStatic AS isStatic, f.isFinal AS isFinal, f.visibility AS visibility, readers, writers
    ORDER BY isStatic DESC, name

- name: JavaStaticContainers
  description: >-
    Static map, collection, array, ThreadLocal, Reference fields, by add vs remove. Memory that
    lives as long as its class loader, ranked by how many methods that touch the field also add to a
    JDK container, against how many also remove. A static map with adders and no removers is the
    classic unbounded cache. Approximate: a method that touches the field and calls a JDK
    container's put or remove is counted, whether or not the receiver is that field. Instance fields
    are not included; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    container: { type: string, default: "", description: "map, collection, array, threadlocal or reference; empty = all." }
    limit: { type: int, default: 50, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_FIELD]->(f:JavaField {isStatic: true})
    WHERE f.container <> 'none' AND ($container = '' OR f.container = $container)
    OPTIONAL MATCH (f)-[:ACCESSED_BY]->(a:JavaFieldAccess)-[:SAME_METHOD_CALL]->(c:JavaMethodCall)
    WHERE c.calleeOwner STARTS WITH 'java.'
      AND c.calleeName IN ['put', 'putAll', 'putIfAbsent', 'computeIfAbsent', 'compute', 'merge',
                           'add', 'addAll', 'addFirst', 'addLast', 'offer', 'push', 'set',
                           'remove', 'removeAll', 'removeIf', 'retainAll', 'clear', 'poll', 'pop',
                           'removeFirst', 'removeLast']
    WITH f,
         collect(DISTINCT CASE WHEN c.calleeName IN ['remove', 'removeAll', 'removeIf', 'retainAll', 'clear',
             'poll', 'pop', 'removeFirst', 'removeLast'] THEN NULL ELSE a.method END) AS adding,
         collect(DISTINCT CASE WHEN c.calleeName IN ['remove', 'removeAll', 'removeIf', 'retainAll', 'clear',
             'poll', 'pop', 'removeFirst', 'removeLast'] THEN a.method END) AS removing
    RETURN f.key AS field, f.type AS declaredType, f.container AS container, f.isFinal AS isFinal,
           f.visibility AS visibility, size(adding) AS addingMethods, size(removing) AS removingMethods
    ORDER BY addingMethods DESC, removingMethods ASC, field
    LIMIT $limit

- name: JavaFieldAccesses
  description: >-
    Every method that reads or writes one field, with source lines. "Who assigns this field, and
    where." A field outside the jar (e.g. `java.lang.System.out`) works too: it is matched by its
    exact key. Only accesses made by code in the jar; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    field: { required: true, type: string, description: "Field key `<binary owner>.<name>`, e.g. org.example.Util.CACHE (not the bare name), from JavaTypeFields or JavaStaticContainers." }
    access: { type: string, default: "", description: "READ or WRITE; empty = both." }
    limit: { type: int, default: 200, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_ACCESS]->(a:JavaFieldAccess {field: $field})
    WHERE $access = '' OR a.access = $access
    RETURN a.method AS method, a.methodOwner AS type, a.access AS access, a.lines AS lines, a.count AS sites
    ORDER BY access DESC, method
    LIMIT $limit

- name: JavaFieldMutationSites
  description: >-
    For one field, each touching method's JDK container adds and removes, by line. The evidence
    behind JavaStaticContainers, method by method: WHERE a cache grows and whether anything ever
    shrinks it. Approximate in the same way: the container calls are made in the same method, not
    proven to be on that field. At most 200 methods.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    field: { required: true, type: string, description: "Field key `<binary owner>.<name>`, e.g. org.example.Util.CACHE (not the bare name)." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_ACCESS]->(a:JavaFieldAccess {field: $field})
    OPTIONAL MATCH (a)-[:SAME_METHOD_CALL]->(c:JavaMethodCall)
    WHERE c.calleeOwner STARTS WITH 'java.'
      AND c.calleeName IN ['put', 'putAll', 'putIfAbsent', 'computeIfAbsent', 'compute', 'merge',
                           'add', 'addAll', 'addFirst', 'addLast', 'offer', 'push', 'set',
                           'remove', 'removeAll', 'removeIf', 'retainAll', 'clear', 'poll', 'pop',
                           'removeFirst', 'removeLast']
    RETURN a.method AS method, a.access AS fieldAccess, a.lines AS fieldLines,
           collect(c.calleeOwner + '.' + c.calleeName + ' @' + toString(c.firstLine)) AS containerCalls
    ORDER BY method
    LIMIT 200

- name: JavaCallers
  description: >-
    Who in a jar calls a type's methods, with lines. By the target's exact binary owner name and
    optionally the method name. The target may be anywhere: `java.lang.System` + `exit`,
    `java.lang.Thread` + `<init>`, or a type in the jar. Constructors are `<init>`. Matched on the
    static receiver type the bytecode names, so a call through a supertype or interface is not
    counted against the subtype; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary name of the called type." }
    method: { type: string, default: "", description: "Method name; empty = any method of the type." }
    limit: { type: int, default: 200, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_CALL]->(c:JavaMethodCall {calleeOwner: $type})
    WHERE $method = '' OR c.calleeName = $method
    RETURN c.callee AS callee, c.caller AS caller, c.callerOwner AS callerType, c.lines AS lines, c.count AS sites
    ORDER BY callee, caller
    LIMIT $limit

- name: JavaMethodsNamed
  description: >-
    Methods of a type with a given name, and each one's first source line. Resolves a stack-trace
    frame (`Type.method(File.java:123)`) to method keys. Overloads are all returned; the one whose
    first line is the highest not above the frame's line holds it. Methods declared by the type
    itself only, not inherited ones; at most 500 rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary class name from the frame." }
    method: { type: string, default: "", description: "Method name from the frame; empty = every method." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_METHOD]->(m:JavaMethod {owner: $type})
    WHERE $method = '' OR m.name = $method
    RETURN m.key AS method, m.kind AS kind, m.line AS firstLine, m.returnType AS returnType,
           m.isStatic AS isStatic, m.isSynthetic AS isSynthetic
    ORDER BY firstLine
    LIMIT 500

- name: JavaOutsideDependencies
  description: >-
    The types outside a jar that it calls most, by call sites and calling methods. JDK and
    third-party types alike: what a jar leans on, and what upgrading a dependency touches. Calls
    only, not field reads, casts or supertypes; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    limit: { type: int, default: 50, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_CALL]->(c:JavaMethodCall {internal: false})
    RETURN c.calleeOwner AS type, sum(c.count) AS callSites, count(DISTINCT c.caller) AS callingMethods
    ORDER BY callSites DESC
    LIMIT $limit

- name: JavaHashedKeysWithoutHashCode
  description: >-
    Map keys and set elements of a class that never overrides `hashCode`. Such a key hashes by
    identity, so two equal-looking keys are two entries, and a key the caller does not keep can
    never be found again. Read from the fields' generic signatures, so it sees the key type a field
    declares, not keys of an undeclared type passed at run time; a key type outside the jar is not
    judged here. At most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    limit: { type: int, default: 100, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_FIELD]->(f:JavaField)-[:KEYED_BY]->(k:JavaType)
    WHERE k.hashCodeFrom = 'java.lang.Object' AND k.kind = 'class'
    RETURN f.key AS field, f.genericType AS declaredAs, k.name AS keyType, k.equalsFrom AS equalsFrom,
           f.isStatic AS isStatic, f.container AS container
    ORDER BY isStatic DESC, field
    LIMIT $limit

- name: JavaFieldsHolding
  description: >-
    Fields that hold a given type, directly or in a container. Declared as it, or as a container of
    it (`List<T>`, `Map<K, T>`, `T[]`), by the fields' generic signatures. Works for any type,
    inside the jar or not: `java.lang.Thread`, `java.lang.ClassLoader`, or a type of the jar's own.
    Exact binary name only, not its subtypes; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary name of the held type." }
    limit: { type: int, default: 200, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_FIELD]->(f:JavaField)
    WHERE f.type = $type OR $type IN f.typeArguments OR f.elementType = $type
    RETURN f.key AS field, f.genericType AS declaredAs, f.container AS container, f.isStatic AS isStatic
    ORDER BY isStatic DESC, field
    LIMIT $limit

# Casts and method bodies are read from the instructions, so they count what the compiler wrote:
# a generic call's erased result is a cast nobody typed, and a string switch is two switches.

- name: JavaCastTargets
  description: >-
    What a jar casts to and tests with instanceof at run time, per target type. How many casts, how
    many instanceof tests and in how many methods, most first. Read from the instructions, so it
    includes the casts the compiler adds for erased generics (`String s = list.get(0)`), and not
    primitive conversions; narrow to `kind` cast or instanceof, or to types in the jar with
    `internalOnly`. At most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    kind: { type: string, default: "", description: "cast or instanceof; empty = both." }
    internalOnly: { type: boolean, default: false, description: "Only target types the jar declares." }
    limit: { type: int, default: 100, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_CAST]->(c:JavaCast)
    WHERE ($kind = '' OR c.kind = $kind) AND (NOT $internalOnly OR c.internal)
    RETURN c.targetType AS targetType,
           sum(CASE WHEN c.kind = 'cast' THEN 1 ELSE 0 END) AS casts,
           sum(CASE WHEN c.kind = 'instanceof' THEN 1 ELSE 0 END) AS instanceofs,
           count(DISTINCT c.method) AS methods
    ORDER BY casts + instanceofs DESC, targetType
    LIMIT $limit

- name: JavaCastSites
  description: >-
    Every cast and instanceof of one type in a jar, with method and line. By exact binary name
    (`java.util.Map$Entry`, an array as `java.lang.String[]`), with whether it is in a lambda or a
    compiler-made method: "where does this program downcast to X?" Not casts to its subtypes; at
    most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { required: true, type: string, description: "Binary name of the target type, e.g. java.util.Map$Entry." }
    kind: { type: string, default: "", description: "cast or instanceof; empty = both." }
    limit: { type: int, default: 200, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_CAST]->(c:JavaCast {targetType: $type})
    WHERE $kind = '' OR c.kind = $kind
    RETURN c.method AS method, c.kind AS kind, c.line AS line, c.lambda AS lambda,
           c.inSyntheticMethod AS inSyntheticMethod, c.spanKey AS spanKey
    ORDER BY method, line
    LIMIT $limit

- name: JavaMethodComplexity
  description: >-
    The jar's methods ranked by conditional branches, lambdas included. With loops (back edges),
    switches, exception handlers, casts, instanceof tests, instruction count and line span. Counted
    from the bytecode: `&&`, `||` and `?:` are branches, and a string switch is two switches. Narrow
    to one type with `type`. Bridge methods are left out; at most `limit` rows.
  params:
    jar: { required: true, type: string, description: "Path of the jar to read." }
    type: { type: string, default: "", description: "Binary class name; empty = every type." }
    limit: { type: int, default: 50, description: "Maximum rows." }
  cypher: |
    MATCH (j:Jar {path: $jar})-[:HAS_METHOD_BODY]->(b:JavaMethodBody)
    WHERE b.method IS NOT NULL AND NOT b.isBridge AND ($type = '' OR b.owner = $type)
    WITH b.method AS method, sum(b.branches) AS branches, sum(b.backEdges) AS loops,
         sum(b.switches) AS switches, sum(b.handlers) AS handlers, sum(b.casts) AS casts,
         sum(b.instanceofs) AS instanceofs, sum(b.instructions) AS instructions,
         max(CASE WHEN b.isLambda THEN 0 ELSE b.lineSpan END) AS lineSpan,
         sum(CASE WHEN b.isLambda THEN 1 ELSE 0 END) AS lambdas
    RETURN method, branches, loops, switches, handlers, casts, instanceofs, instructions, lineSpan, lambdas
    ORDER BY branches DESC, instructions DESC, method
    LIMIT $limit
