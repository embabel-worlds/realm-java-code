# Every producer reads the jar itself, when a query reaches it, through the appliance's `jar`
# producer kind (ArchUnit over the class files). Nothing is stored: the rows are transient for
# the query that asked. `emit` names the collection, `by` the row property the anchor key selects
# on — `jarPath` for a whole jar, otherwise the key is `<jar path>!<value>`, which is exactly the
# `id` / `…Id` a row from the previous hop already carries.

# Whole-jar collections, anchored on a pinned path: (j:Jar {path: '…'}).
#
# `javaJarArtifact` also projects the Artifact contract (realm-code-model types/artifact.yml) onto its one
# row, since JavaArtifact is `parents: [Artifact]`: `compute:` is one Cypher expression per property over
# the record bound as `r` — the `artifact` collection's `coordinate`, `groupId`, `artifactId`, `version`,
# `fileName`, `sha256`, `types` (the `jar` kind carries `compute:`; engine JarProducer). `name` is the
# coordinate without its version in whichever form the jar allowed: a jar with Maven metadata has a groupId,
# one with only a manifest title has an artifactId and no groupId, one with neither has only the file name
# as its coordinate (engine JarCoordinate.parts). `version` is the row's own already.
- name: javaJarArtifact
  kind: jar
  emit: artifact
  compute:
    ecosystem: "'maven'"
    name: "CASE WHEN r.groupId IS NOT NULL THEN r.groupId + ':' + r.artifactId WHEN r.artifactId IS NOT NULL THEN r.artifactId ELSE r.coordinate END"
- { name: javaJarPackages, kind: jar, emit: packages }
- { name: javaJarTypes,    kind: jar, emit: types }
- { name: javaJarFields,   kind: jar, emit: fields }
- { name: javaJarMethods,  kind: jar, emit: methods }
- { name: javaJarAccesses, kind: jar, emit: accesses }
- { name: javaJarCalls,    kind: jar, emit: calls }
- { name: javaJarCasts,    kind: jar, emit: casts }
- { name: javaJarMethodBodies, kind: jar, emit: methodBodies }

# Hops from a member already in hand.
- { name: javaTypesInPackage,    kind: jar, emit: types,    by: packageName }
- { name: javaFieldsOfType,      kind: jar, emit: fields,   by: owner }
- { name: javaMethodsOfType,     kind: jar, emit: methods,  by: owner }
- { name: javaSubclassesOf,      kind: jar, emit: types,    by: superclass }
- { name: javaImplementorsOf,    kind: jar, emit: types,    by: interfaces }
- { name: javaAccessesOfField,   kind: jar, emit: accesses, by: field }
- { name: javaAccessesInMethod,  kind: jar, emit: accesses, by: method }
- { name: javaCallsFromMethod,   kind: jar, emit: calls,    by: caller }
- { name: javaCallsToMethod,     kind: jar, emit: calls,    by: callee }
- { name: javaMethodByKey,       kind: jar, emit: methods,  by: key }
- { name: javaMethodAt,          kind: jar, emit: methods,  by: at }
- { name: javaTypeByName,        kind: jar, emit: types,    by: name }
- { name: javaCastsInMethod,     kind: jar, emit: casts,    by: method }
- { name: javaCastsToType,       kind: jar, emit: casts,    by: targetType }
- { name: javaBodiesOfMethod,    kind: jar, emit: methodBodies, by: method }
