# Java bytecode as a graph, read from the jar on demand. Nothing in this realm is stored: every
# node below is VIRTUAL, produced by the appliance's `jar` producer kind when a query reaches a
# jar, and gone when the query ends. Nothing here knows any library — point it at any jar.
#
# Start at a jar by pinning its path (relative to the world's data/ tree, absolute under a trusted
# root, or relative to this realm's own directory):
#
#   MATCH (j:Jar {path: 'data/jars/spring-core-6.2.18.jar'})-[:HAS_TYPE]->(t:JavaType) …
#
#   Jar ─IS_ARTIFACT▶ JavaArtifact      Jar ─HAS_PACKAGE / HAS_TYPE / HAS_FIELD / HAS_METHOD / HAS_ACCESS / HAS_CALL▶ …
#   JavaPackage ─CONTAINS_TYPE▶ JavaType
#   JavaType ─DECLARES_FIELD▶ JavaField,  ─DECLARES_METHOD▶ JavaMethod,  ─HAS_SUBCLASS / HAS_IMPLEMENTOR▶ JavaType
#   JavaField ─ACCESSED_BY▶ FieldAccess
#   JavaMethod ─MAKES_ACCESS▶ FieldAccess,  ─MAKES_CALL▶ MethodCall,  ─CALLED_BY▶ MethodCall
#   FieldAccess ─IN_METHOD▶ JavaMethod,  ─SAME_METHOD_CALL▶ MethodCall     MethodCall ─TARGETS▶ JavaMethod (targets inside the jar)
#
# Every node's `id` is `<jar path>!<member>`, and every reference to another member has an `…Id`
# twin (`ownerId`, `methodId`, `calleeId`), which is what the next hop keys on. Names are binary
# class names, `pkg.Outer$Inner`, exactly as a heap dump or stack trace spells them, so another
# realm joins a JavaType by `name` and a JavaField by `key` with no translation.
#
# A whole-jar hop (Jar ─HAS_CALL▶ MethodCall) reads every row of the jar; narrow it in the same
# MATCH (`{calleeOwner: 'java.util.Map'}`), which the producer applies before rows reach the graph.

- name: JavaArtifact
  description: "The jar itself: coordinate, file, SHA-256, type count. Reached from a pinned jar: `MATCH (j:Jar {path:$jar})-[:IS_ARTIFACT]->(a:JavaArtifact)`. The coordinate is read from the jar: `groupId:artifactId:version` from Maven metadata, `title:version` from the manifest, else the file name."
  properties:
    id: { identity: true, description: "The jar path as the query gave it. Identity." }
    jarPath: "The jar path as the query gave it."
    coordinate: "The jar's coordinate as described above."
    groupId: "Maven group id, when the jar carries Maven metadata."
    artifactId: "Maven artifact id, or the manifest's Implementation-Title."
    version: "Version from Maven metadata or the manifest."
    fileName: "The jar's file name."
    sha256: "SHA-256 of the jar file: which exact build was read."
    types: { type: int, description: "Classes, interfaces, enums, records and annotations in the jar." }
  virtualJoins:
    - { anchorLabel: Jar, relationship: IS_ARTIFACT, keyField: path, recordKeyField: anchorKey, producer: javaJarArtifact,
        description: "The jar's coordinate and checksum: `MATCH (j:Jar {path:$jar})-[:IS_ARTIFACT]->(a:JavaArtifact)`." }

- name: JavaPackage
  description: "A Java package in a jar, with how many types it holds. Its types: CONTAINS_TYPE."
  properties:
    id: { identity: true, description: "`<jar path>!<package>`. Identity." }
    jarPath: "The jar path."
    name: "Dotted package name."
    types: { type: int, description: "Types in this package." }
  virtualJoins:
    - { anchorLabel: Jar, relationship: HAS_PACKAGE, keyField: path, recordKeyField: anchorKey, producer: javaJarPackages,
        description: "Every package in a jar." }

- name: JavaType
  description: "A class, interface, enum, record or annotation compiled into a jar, including nested, anonymous and local classes. `name` is the binary name (`a.b.Outer$Inner`), the form heap dumps and stack traces use. `superclass` and `interfaces` name supertypes wherever they live; HAS_SUBCLASS / HAS_IMPLEMENTOR walk down to subtypes in the same jar. Fields: DECLARES_FIELD. Methods: DECLARES_METHOD."
  properties:
    id: { identity: true, description: "`<jar path>!<binary class name>`. Identity; the key every hop from a type takes." }
    jarPath: "The jar path."
    name: "Binary class name, e.g. `com.example.Cache$Entry`."
    simpleName: "Name without package or enclosing class; empty for anonymous classes."
    packageName: "Dotted package name."
    kind: "`class`, `interface`, `enum`, `record` or `annotation`."
    nesting: "`top-level`, `member`, `anonymous` or `local`."
    visibility: "`public`, `protected`, `package` or `private`."
    isAbstract: { type: boolean, description: "An abstract class (always false for interfaces)." }
    isFinal: { type: boolean, description: "Declared final." }
    sourceFile: "Source file name from debug info, e.g. `Cache.java`."
    superclass: "Binary name of the direct superclass, wherever it lives."
    interfaces: { cardinality: LIST, description: "Binary names of directly implemented interfaces, wherever they live." }
    enclosingType: "Binary name of the enclosing class, for nested, anonymous and local classes."
    fields: { type: int, description: "Fields declared by this type (not inherited)." }
    staticFields: { type: int, description: "Static fields declared by this type." }
    methods: { type: int, description: "Methods, constructors and static initializer declared by this type." }
  virtualJoins:
    - { anchorLabel: Jar, relationship: HAS_TYPE, keyField: path, recordKeyField: anchorKey, producer: javaJarTypes,
        description: "Every type in a jar; narrow with `{name: '…'}` or `{packageName: '…'}` in the same MATCH." }
    - { anchorLabel: JavaPackage, relationship: CONTAINS_TYPE, keyField: id, recordKeyField: anchorKey, producer: javaTypesInPackage,
        description: "The types of one package." }
    - { anchorLabel: JavaType, relationship: HAS_SUBCLASS, keyField: id, recordKeyField: anchorKey, producer: javaSubclassesOf,
        description: "Types in the same jar that directly extend this one." }
    - { anchorLabel: JavaType, relationship: HAS_IMPLEMENTOR, keyField: id, recordKeyField: anchorKey, producer: javaImplementorsOf,
        description: "Types in the same jar that directly implement this interface." }

- name: JavaField
  description: "A field declared by a type in a jar. `key` is `Owner.name` with the binary owner name, the same `Owner.field` a heap dump's path to a GC root names. `container` says whether the declared type is a map, collection, array, ThreadLocal or Reference. Who reads or writes it: ACCESSED_BY."
  properties:
    id: { identity: true, description: "`<jar path>!<owner>.<field>`. Identity." }
    jarPath: "The jar path."
    key: "`<binary owner name>.<field name>`, e.g. `com.example.Registry.listeners`."
    owner: "Binary name of the declaring type."
    ownerId: "The declaring JavaType's id."
    name: "Field name."
    type: "Declared type; arrays as `T[]`."
    container: "`map`, `collection`, `array`, `threadlocal`, `reference` or `none`, by the declared type and its JDK supertypes."
    isStatic: { type: boolean, description: "A static field: one per class loader, reachable for as long as the class is." }
    isFinal: { type: boolean, description: "Declared final." }
    visibility: "`public`, `protected`, `package` or `private`."
  virtualJoins:
    - { anchorLabel: Jar, relationship: HAS_FIELD, keyField: path, recordKeyField: anchorKey, producer: javaJarFields,
        description: "Every field in a jar; narrow with `{isStatic: true}`, `{container: 'map'}` or `{key: '…'}` in the same MATCH." }
    - { anchorLabel: JavaType, relationship: DECLARES_FIELD, keyField: id, recordKeyField: anchorKey, producer: javaFieldsOfType,
        description: "The fields one type declares." }

- name: JavaMethod
  description: "A method, constructor or static initializer declared by a type in a jar. `key` is `Owner.name(param types)`; constructors are `<init>`, static initializers `<clinit>`, lambda bodies their synthetic `lambda$…` methods. Its calls: MAKES_CALL. Who calls it: CALLED_BY. Its field accesses: MAKES_ACCESS."
  properties:
    id: { identity: true, description: "`<jar path>!<method key>`. Identity." }
    jarPath: "The jar path."
    key: "`<binary owner>.<name>(<parameter types>)`."
    owner: "Binary name of the declaring type."
    ownerId: "The declaring JavaType's id."
    name: "Method name; `<init>` for constructors, `<clinit>` for a static initializer."
    kind: "`method`, `constructor` or `static-initializer`."
    parameters: { cardinality: LIST, description: "Parameter types in order; arrays as `T[]`." }
    returnType: "Return type; `void` for none."
    isStatic: { type: boolean, description: "A static method." }
    isAbstract: { type: boolean, description: "Abstract or interface method without a body." }
    isSynthetic: { type: boolean, description: "Compiler-generated: bridge methods, lambda bodies, accessors." }
    visibility: "`public`, `protected`, `package` or `private`."
    line: { type: int, description: "First source line of the body from debug info; 0 when absent or abstract." }
  virtualJoins:
    - { anchorLabel: Jar, relationship: HAS_METHOD, keyField: path, recordKeyField: anchorKey, producer: javaJarMethods,
        description: "Every method in a jar; narrow with `{owner: '…'}` or `{name: '…'}` in the same MATCH." }
    - { anchorLabel: JavaType, relationship: DECLARES_METHOD, keyField: id, recordKeyField: anchorKey, producer: javaMethodsOfType,
        description: "The methods one type declares." }
    - { anchorLabel: FieldAccess, relationship: IN_METHOD, keyField: methodId, recordKeyField: anchorKey, producer: javaMethodByKey,
        description: "The method that made a field access." }
    - { anchorLabel: MethodCall, relationship: TARGETS, keyField: calleeId, recordKeyField: anchorKey, producer: javaMethodByKey,
        description: "The method a call targets, when the jar declares it (none for JDK or other-library targets)." }

- name: FieldAccess
  description: "Every place one method touches one field, one way: READ (getfield/getstatic) or WRITE (putfield/putstatic, i.e. assignment), with source lines. Adding to a collection held in a field is a READ of the field plus a MethodCall (`put`, `add`) in the same method, not a WRITE. The method: IN_METHOD."
  properties:
    id: { identity: true, description: "`<jar path>!<method> READ|WRITE <field>`. Identity." }
    jarPath: "The jar path."
    key: "`<method key> READ|WRITE <field key>`."
    method: "Key of the accessing method."
    methodId: "The accessing JavaMethod's id."
    methodOwner: "Binary name of the accessing method's type."
    field: "`<owner>.<name>` of the field accessed, as the bytecode names it; may be outside the jar."
    fieldId: "The field's id, `<jar path>!<field>`; a JavaField exists for it only when `internal`."
    fieldOwner: "Binary name of the field's owner."
    fieldName: "Field name."
    access: "`READ` or `WRITE`."
    lines: { cardinality: LIST, type: int, description: "Every source line with this access, ascending." }
    firstLine: { type: int, description: "The first of `lines`." }
    count: { type: int, description: "Distinct source lines with this access." }
    internal: { type: boolean, description: "True when the field's owner is in the jar." }
  virtualJoins:
    - { anchorLabel: Jar, relationship: HAS_ACCESS, keyField: path, recordKeyField: anchorKey, maxFanoutTotal: 30000, producer: javaJarAccesses,
        description: "Every field access in a jar; narrow with `{field: '…'}` or `{access: 'WRITE'}` in the same MATCH. Works for fields outside the jar, e.g. `{field: 'java.lang.System.out'}`." }
    - { anchorLabel: JavaField, relationship: ACCESSED_BY, keyField: id, recordKeyField: anchorKey, producer: javaAccessesOfField,
        description: "Every method's reads and writes of one field." }
    - { anchorLabel: JavaMethod, relationship: MAKES_ACCESS, keyField: id, recordKeyField: anchorKey, producer: javaAccessesInMethod,
        description: "Every field one method reads or writes." }

- name: MethodCall
  description: "Every call from one method to one target method or constructor, with source lines. The target is named as the bytecode names it (the static receiver type): `callee`, `calleeOwner`, `calleeName` are always set, so calls into the JDK or other libraries are matched by property (`calleeOwner = 'java.util.Map' AND calleeName = 'put'`). The target method, when the jar declares it: TARGETS."
  properties:
    id: { identity: true, description: "`<jar path>!<caller> CALLS <callee>`. Identity." }
    jarPath: "The jar path."
    key: "`<caller key> CALLS <callee full name>`."
    caller: "Key of the calling method."
    callerId: "The calling JavaMethod's id."
    callerOwner: "Binary name of the calling method's type."
    callee: "Target's full name, `<owner>.<name>(<parameter types>)`."
    calleeId: "The target's id, `<jar path>!<callee>`; a JavaMethod exists for it only when `internal`."
    calleeOwner: "Binary name of the target's owner as the bytecode names it, e.g. `java.util.Map`."
    calleeName: "Target method name; `<init>` for a constructor call."
    lines: { cardinality: LIST, type: int, description: "Every source line with this call, ascending." }
    firstLine: { type: int, description: "The first of `lines`." }
    count: { type: int, description: "Distinct source lines with this call." }
    internal: { type: boolean, description: "True when the target's owner is in the jar." }
  virtualJoins:
    - { anchorLabel: Jar, relationship: HAS_CALL, keyField: path, recordKeyField: anchorKey, maxFanoutTotal: 30000, producer: javaJarCalls,
        description: "Every call in a jar; narrow with `{calleeOwner: '…'}` and `{calleeName: '…'}` in the same MATCH — e.g. who calls `java.lang.System.exit`." }
    - { anchorLabel: JavaMethod, relationship: MAKES_CALL, keyField: id, recordKeyField: anchorKey, producer: javaCallsFromMethod,
        description: "Every call one method makes." }
    - { anchorLabel: JavaMethod, relationship: CALLED_BY, keyField: id, recordKeyField: anchorKey, producer: javaCallsToMethod,
        description: "Every call to one method from elsewhere in the jar." }
    - { anchorLabel: FieldAccess, relationship: SAME_METHOD_CALL, keyField: methodId, recordKeyField: anchorKey, producer: javaCallsFromMethod,
        description: "The calls made by the method that made this field access — e.g. whether the method that reads a map field also calls `put` or `remove`." }
